<svg
  viewBox="0 0 600 540"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  className="w-full h-auto select-none pointer-events-none"
  aria-hidden="true"
>
  <!-- Perspective Construction Lines (Sky and Horizon Rays) -->
  <g stroke="#C4AA8E" stroke-width="0.75" opacity="0.55">
    <!-- Ray extending straight up from top roof peak -->
    <line x1="306" y1="46" x2="306" y2="0" />
    
    <!-- Rays from peak towards right horizon -->
    <line x1="306" y1="46" x2="600" y2="185" />
    <line x1="422" y1="102" x2="600" y2="185" />
    <line x1="306" y1="134" x2="600" y2="280" />
    
    <!-- Secondary sky construction rays -->
    <line x1="306" y1="88" x2="600" y2="230" />
    <line x1="306" y1="46" x2="0" y2="175" />
  </g>

  <!-- Ground Perspective Grid Lines -->
  <g stroke="#C4AA8E" stroke-width="0.8" opacity="0.6">
    <!-- Longitudinal ground perspective lines receding towards right vanishing point -->
    <line x1="-30" y1="468" x2="600" y2="438" />
    <line x1="-30" y1="488" x2="600" y2="442" />
    <line x1="-30" y1="510" x2="600" y2="446" />
    <line x1="-30" y1="535" x2="600" y2="450" />

    <!-- Transverse pavement lines angling across the ground -->
    <line x1="75" y1="540" x2="235" y2="450" />
    <line x1="175" y1="540" x2="325" y2="446" />
    <line x1="275" y1="540" x2="415" y2="444" />
    <line x1="385" y1="540" x2="505" y2="442" />

    <!-- Far-right vertical site markers / posts -->
    <line x1="545" y1="412" x2="545" y2="454" stroke-width="0.9" />
    <line x1="568" y1="422" x2="568" y2="454" stroke-width="0.9" />
  </g>

  <!-- Top Parapet Box / Upper Volume Wireframe -->
  <g stroke="#9E7D5D" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Parapet Roof Peak Corner -->
    <line x1="306" y1="46" x2="306" y2="134" stroke-width="1.3" />

    <!-- Top Parapet Roofline down-left to horizon -->
    <line x1="306" y1="46" x2="0" y2="222" stroke-width="1.3" />
    <line x1="306" y1="88" x2="0" y2="258" stroke-width="0.8" opacity="0.7" />

    <!-- Top Parapet Roofline down-right -->
    <line x1="306" y1="46" x2="422" y2="102" stroke-width="1.3" />
    <line x1="422" y1="102" x2="422" y2="188" stroke-width="1.2" />
    <line x1="306" y1="88" x2="422" y2="142" stroke-width="0.8" opacity="0.7" />
  </g>

  <!-- Main Two-Storey Building Cornice and Architectural Step -->
  <g stroke="#8F6E4E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Right Cornice Line -->
    <line x1="306" y1="134" x2="412" y2="188" stroke-width="1.6" />
    <line x1="306" y1="142" x2="412" y2="195" stroke-width="1" opacity="0.8" />

    <!-- Left Cornice Line (with Architectural Step-Down) -->
    <line x1="306" y1="134" x2="152" y2="228" stroke-width="1.6" />
    <line x1="306" y1="142" x2="152" y2="235" stroke-width="1" opacity="0.8" />
    <!-- Step-down vertical drop -->
    <line x1="152" y1="228" x2="152" y2="248" stroke-width="1.4" />
    <!-- Lower parapet continuing to left edge -->
    <line x1="152" y1="248" x2="0" y2="310" stroke-width="1.4" />
    <line x1="152" y1="254" x2="0" y2="315" stroke-width="0.9" opacity="0.7" />
  </g>

  <!-- Central Vertical Corner Pillar (Key Focal Element) -->
  <g stroke="#7D5D3E" stroke-width="1.3" stroke-linecap="round">
    <line x1="302" y1="142" x2="302" y2="442" stroke-width="1" opacity="0.7" />
    <line x1="306" y1="134" x2="306" y2="442" stroke-width="1.8" />
    <line x1="310" y1="142" x2="310" y2="442" stroke-width="1" opacity="0.7" />
  </g>

  <!-- Right Facade (Two Storeys + Single Storey Low Wing) -->
  <g stroke="#9E7D5D" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Right Corner Column of Main Block -->
    <line x1="408" y1="195" x2="408" y2="444" stroke-width="0.9" opacity="0.7" />
    <line x1="412" y1="188" x2="412" y2="444" stroke-width="1.6" />

    <!-- Intermediate Column on Right Facade -->
    <line x1="358" y1="160" x2="358" y2="443" stroke-width="1.2" />
    <line x1="362" y1="160" x2="362" y2="443" stroke-width="0.8" opacity="0.6" />

    <!-- Horizontal Floor Spandrel Band (Between Ground and Upper Floor) -->
    <line x1="306" y1="334" x2="412" y2="356" stroke-width="1.2" />
    <line x1="306" y1="342" x2="412" y2="362" stroke-width="1.6" />
    <line x1="306" y1="348" x2="412" y2="368" stroke-width="1" opacity="0.8" />

    <!-- Upper Floor Window Transom and Sills -->
    <line x1="306" y1="168" x2="412" y2="218" stroke-width="0.9" opacity="0.8" />
    <!-- Upper Floor Glazing Mullions -->
    <!-- Bay 1 -->
    <line x1="326" y1="168" x2="326" y2="334" stroke-width="0.9" />
    <line x1="342" y1="168" x2="342" y2="334" stroke-width="0.9" />
    <!-- Bay 2 -->
    <line x1="378" y1="198" x2="378" y2="344" stroke-width="0.9" />
    <line x1="394" y1="208" x2="394" y2="350" stroke-width="0.9" />

    <!-- Lower Floor Storefront Transom and Mullions -->
    <line x1="306" y1="368" x2="412" y2="385" stroke-width="0.9" />
    <line x1="326" y1="368" x2="326" y2="442" stroke-width="0.9" />
    <line x1="342" y1="368" x2="342" y2="442" stroke-width="0.9" />
    <line x1="378" y1="378" x2="378" y2="443" stroke-width="0.9" />
    <line x1="394" y1="382" x2="394" y2="443" stroke-width="0.9" />

    <!-- Base Plinth / Foundation -->
    <line x1="306" y1="442" x2="412" y2="444" stroke-width="1.5" />
    <line x1="306" y1="450" x2="412" y2="450" stroke-width="1" opacity="0.7" />

    <!-- Single-Storey Right Wing / Colonnade Pavilion -->
    <line x1="412" y1="368" x2="505" y2="388" stroke-width="1.4" />
    <line x1="412" y1="375" x2="505" y2="394" stroke-width="0.9" opacity="0.8" />

    <!-- Wing Vertical Colonnade Posts -->
    <line x1="432" y1="372" x2="432" y2="446" stroke-width="1.2" />
    <line x1="468" y1="378" x2="468" y2="448" stroke-width="1.2" />
    <line x1="505" y1="388" x2="505" y2="450" stroke-width="1.4" />

    <!-- Wing Storefront Detail -->
    <rect x="442" y="394" width="16" height="52" stroke="#9E7D5D" stroke-width="0.8" fill="none" />
    <line x1="505" y1="388" x2="530" y2="398" stroke-width="0.8" opacity="0.6" />
    <line x1="505" y1="450" x2="530" y2="452" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Left Facade (Multi-Storey Extended Glass and Stone Facade) -->
  <g stroke="#9E7D5D" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Structural Columns on Left Facade -->
    <!-- Column at step -->
    <line x1="152" y1="248" x2="152" y2="458" stroke-width="1.3" />
    <!-- Intermediate columns -->
    <line x1="228" y1="180" x2="228" y2="448" stroke-width="1.2" />
    <line x1="104" y1="275" x2="104" y2="464" stroke-width="1.1" />
    <line x1="54" y1="300" x2="54" y2="472" stroke-width="1" />
    <line x1="16" y1="318" x2="16" y2="478" stroke-width="1" />

    <!-- Horizontal Floor Spandrel Band across Left Facade -->
    <line x1="306" y1="334" x2="0" y2="395" stroke-width="1.2" />
    <line x1="306" y1="342" x2="0" y2="400" stroke-width="1.6" />
    <line x1="306" y1="348" x2="0" y2="405" stroke-width="1" opacity="0.8" />

    <!-- Upper Floor Window Transoms -->
    <line x1="306" y1="168" x2="0" y2="330" stroke-width="0.9" opacity="0.8" />
    <line x1="306" y1="240" x2="0" y2="360" stroke-width="0.8" opacity="0.6" />

    <!-- Upper Floor Glazing Mullions -->
    <!-- Bay between 228 and 302 -->
    <line x1="254" y1="195" x2="254" y2="340" stroke-width="0.9" />
    <line x1="278" y1="182" x2="278" y2="338" stroke-width="0.9" />
    <!-- Bay between 152 and 228 -->
    <line x1="178" y1="238" x2="178" y2="356" stroke-width="0.9" />
    <line x1="202" y1="224" x2="202" y2="350" stroke-width="0.9" />
    <!-- Bay between 104 and 152 -->
    <line x1="128" y1="270" x2="128" y2="370" stroke-width="0.8" />
    <!-- Bay between 54 and 104 -->
    <line x1="78" y1="295" x2="78" y2="384" stroke-width="0.8" />
    <!-- Bay between 16 and 54 -->
    <line x1="34" y1="315" x2="34" y2="394" stroke-width="0.8" />

    <!-- Lower Floor Storefront Transom and Vertical Mullions -->
    <line x1="306" y1="368" x2="0" y2="418" stroke-width="0.9" />
    <line x1="278" y1="368" x2="278" y2="444" stroke-width="0.9" />
    <line x1="254" y1="368" x2="254" y2="445" stroke-width="0.9" />
    <line x1="202" y1="375" x2="202" y2="450" stroke-width="0.8" />
    <line x1="178" y1="380" x2="178" y2="453" stroke-width="0.8" />
    <line x1="128" y1="390" x2="128" y2="460" stroke-width="0.8" />
    <line x1="78" y1="400" x2="78" y2="468" stroke-width="0.8" />
    <line x1="34" y1="410" x2="34" y2="475" stroke-width="0.8" />

    <!-- Base Plinth / Stepped Foundation along Left Facade -->
    <line x1="306" y1="442" x2="0" y2="475" stroke-width="1.5" />
    <line x1="306" y1="450" x2="0" y2="483" stroke-width="1" opacity="0.75" />
  </g>

  <!-- Architectural Entourage Figures (Two Scale People Standing near Corner) -->
  <g stroke="#6B4D30" stroke-width="1.1" fill="#6B4D30" opacity="0.85">
    <!-- Person 1 (Facing front-right) -->
    <circle cx="248" cy="410" r="2.8" />
    <line x1="248" y1="413" x2="248" y2="427" stroke-width="1.4" />
    <line x1="248" y1="427" x2="246" y2="442" stroke-width="1.1" />
    <line x1="248" y1="427" x2="250" y2="442" stroke-width="1.1" />

    <!-- Person 2 (Beside) -->
    <circle cx="256" cy="412" r="2.5" />
    <line x1="256" y1="415" x2="256" y2="427" stroke-width="1.3" />
    <line x1="256" y1="427" x2="254" y2="442" stroke-width="1" />
    <line x1="256" y1="427" x2="258" y2="442" stroke-width="1" />
  </g>
</svg>